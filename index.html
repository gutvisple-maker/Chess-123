<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шахматы</title>
  <style>
    body { font-family: sans-serif; background: #222; color: #eee; margin: 0; padding: 16px; }
    #board { display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; max-width: 400px; margin: 0 auto; aspect-ratio: 1; border: 2px solid #444; }
    .square { display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; user-select: none; }
    .light { background: #f0d9b5; color: #000; }
    .dark { background: #b58863; color: #000; }
    .blocked { background: #444 !important; color: #444; cursor: not-allowed; border: 1px solid #222; }
    #controls { max-width: 400px; margin: 16px auto; display: flex; gap: 8px; flex-wrap: wrap; }
    button { flex: 1; padding: 12px; font-size: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    #status { text-align: center; margin-top: 12px; font-size: 16px; color: #fff; min-height: 24px; }
  </style>
</head>
<body>
  <div id="board"></div>
  <div id="controls"></div>
  <div id="status">Подключение к базе...</div>

  <!-- Firebase SDK (совместимая версия) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // ===== 1. Определяем роль по якорю в адресе (#h) =====
    const isHost = location.hash === '#h';

    // ===== 2. Конфиг Firebase (ваши ключи) =====
    const firebaseConfig = {
      apiKey: "AIzaSyAJJr63C9nLQ6SHHwDbqTmX3xHFY-_eyXM",
      authDomain: "chess-30025.firebaseapp.com",
      databaseURL: "https://chess-30025-default-rtdb.firebaseio.com",
      projectId: "chess-30025",
      storageBucket: "chess-30025.firebasestorage.app",
      messagingSenderId: "33351797755",
      appId: "1:33351797755:web:bea157f178c09b6c0d595e",
      measurementId: "G-BB0Y611NYN"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ===== 3. Состояние доски =====
    let board = Array(64).fill(null);
    let blocked = new Set();
    let selected = null;
    let currentTurn = 'w'; 

    // Начальная расстановка
    const startBoard = () => {
      board = Array(64).fill(null);
      for (let i = 8; i < 16; i++) board[i] = 'wP';
      for (let i = 48; i < 56; i++) board[i] = 'bP';
      board[0] = 'bR'; board[7] = 'bR'; board[56] = 'wR'; board[63] = 'wR';
      board[1] = 'bN'; board[6] = 'bN'; board[57] = 'wN'; board[62] = 'wN';
      board[2] = 'bB'; board[5] = 'bB'; board[58] = 'wB'; board[61] = 'wB';
      board[3] = 'bQ'; board[59] = 'wQ';
      board[4] = 'bK'; board[60] = 'wK';
    };
    startBoard();

    // ===== 4. Отрисовка доски =====
    const symbols = { wP:'♙', wR:'♖', wN:'♘', wB:'♗', wQ:'♕', wK:'♔',
                      bP:'♟', bR:'♜', bN:'♞', bB:'♝', bQ:'♛', bK:'♚' };
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');

    function render() {
      boardEl.innerHTML = '';
      for (let i = 0; i < 64; i++) {
        const sq = document.createElement('div');
        const row = Math.floor(i / 8);
        const col = i % 8;
        sq.className = 'square ' + ((row + col) % 2 === 0 ? 'light' : 'dark');
        if (blocked.has(i)) sq.classList.add('blocked');
        if (board[i]) sq.textContent = symbols[board[i]] || '';
        
        // Подсветка выбранной фигуры
        if (selected === i) sq.style.boxShadow = 'inset 0 0 0 4px #e74c3c';
        
        sq.dataset.index = i;
        sq.addEventListener('click', () => onSquareClick(i));
        boardEl.appendChild(sq);
      }
    }

    // ===== 5. Логика ходов (упрощённая) =====
    function onSquareClick(i) {
      if (blocked.has(i)) return;
      
      if (selected === null) {
        if (board[i] && board[i][0] === currentTurn) selected = i;
      } else {
        if (i === selected) { selected = null; render(); return; }
        const piece = board[selected];
        if (!piece) { selected = null; render(); return; }
        const target = board[i];
        
        // Нельзя есть свои
        if (target && target[0] === piece[0]) { 
            selected = null; render(); return; 
        }
        
        // Делаем ход
        board[i] = piece;
        board[selected] = null;
        selected = null;
        currentTurn = currentTurn === 'w' ? 'b' : 'w';
        syncToFirebase();
        render();
      }
      render();
    }

    // ===== 6. Firebase синхронизация =====
    const roomRef = db.ref('rooms/default');

    function syncToFirebase() {
      roomRef.set({
        board: board,
        blocked: Array.from(blocked),
        turn: currentTurn,
        updated: Date.now()
      });
    }

    roomRef.on('value', (snap) => {
      const data = snap.val();
      if (!data) {
        statusEl.textContent = 'Комната пуста. Сделайте ход или нажмите кнопку.';
        return;
      }
      board = data.board || board;
      blocked = new Set(data.blocked || []);
      currentTurn = data.turn || 'w';
      render();
      statusEl.textContent = currentTurn === 'w' ? 'Ход белых' : 'Ход чёрных';
    });

    // ===== 7. Кнопки (только для хоста) =====
    const controls = document.getElementById('controls');
    if (isHost) {
      // Кнопка 1: Кража
      const btnSteal = document.createElement('button');
      btnSteal.textContent = '👽 Украсть фигуру';
      btnSteal.style.background = '#c0392b';
      btnSteal.style.color = '#fff';
      btnSteal.onclick = () => {
        statusEl.textContent = 'Нажмите на фигуру ПРОТИВНИКА, чтобы украсть её';
        const handler = (e) => {
          const idx = parseInt(e.target.dataset.index);
          if (!isNaN(idx) && board[idx] && board[idx][0] !== 'w') {
            board[idx] = null;
            syncToFirebase();
            render();
            statusEl.textContent = 'Фигура украдена!';
          }
          boardEl.removeEventListener('click', handler);
        };
        boardEl.addEventListener('click', handler, { once: true });
      };

      // Кнопка 2: Спавн пешки
      const btnSpawn = document.createElement('button');
      btnSpawn.textContent = '♙ Создать пешку';
      btnSpawn.style.background = '#27ae60';
      btnSpawn.style.color = '#fff';
      btnSpawn.onclick = () => {
        statusEl.textContent = 'Нажмите на пустую клетку для белой пешки';
        const handler = (e) => {
          const idx = parseInt(e.target.dataset.index);
          if (!isNaN(idx) && !board[idx] && !blocked.has(idx)) {
            board[idx] = 'wP';
            syncToFirebase();
            render();
            statusEl.textContent = 'Пешка создана!';
          }
          boardEl.removeEventListener('click', handler);
        };
        boardEl.addEventListener('click', handler, { once: true });
      };

      // Кнопка 3: Блокировка клетки
      const btnBlock = document.createElement('button');
      btnBlock.textContent = '🚫 Удалить клетку';
      btnBlock.style.background = '#8e44ad';
      btnBlock.style.color = '#fff';
      btnBlock.onclick = () => {
        statusEl.textContent = 'Нажмите на клетку, чтобы заблокировать её';
        const handler = (e) => {
          const idx = parseInt(e.target.dataset.index);
          if (!isNaN(idx)) {
            blocked.add(idx);
            board[idx] = null;
            syncToFirebase();
            render();
            statusEl.textContent = 'Клетка удалена!';
          }
          boardEl.removeEventListener('click', handler);
        };
        boardEl.addEventListener('click', handler, { once: true });
      };

      controls.appendChild(btnSteal);
      controls.appendChild(btnSpawn);
      controls.appendChild(btnBlock);
    }

    render();
  </script>
</body>
  </html>
