<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Шахматы</title>
<style>
*{box-sizing:border-box}
:root{
--bg:#17181d;--panel:#232429;--panel2:#2b2c33;--line:#3a3b44;
--txt:#e8eaed;--muted:#9aa0a8;--accent:#81b64c;--accent-dark:#6e9d3d;--blue:#4b8dde;
--board-light:#f0d9b5;--board-dark:#b58863;--danger:#c94f4f;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);margin:0;padding:0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.board-container{width:100%;max-width:420px;position:relative;padding:14px 12px 0}
#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;aspect-ratio:1/1;border-radius:8px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .3s}
#board.flipped{transform:rotate(180deg)}
#board.flipped .piece-img,#board.flipped .move-dot,#board.flipped .piece-txt{transform:rotate(180deg)}
.square{display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;position:relative;overflow:hidden}
.light{background:var(--board-light)}.dark{background:var(--board-dark)}
.blocked{background:#2a2a2a!important;cursor:not-allowed}
.piece-img{width:90%;height:90%;object-fit:contain;pointer-events:none;display:block}
.piece-txt{font-size:34px;line-height:1;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.piece-txt.w{color:#fff}.piece-txt.b{color:#1a1a1a}
.controls-wrapper{width:100%;max-width:420px;padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px}
.status-bar{display:flex;gap:8px;width:100%}
.status-game,.status-tech{flex:1;text-align:center;font-size:14px;font-weight:600;padding:9px;background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:24px;display:flex;align-items:center;justify-content:center;word-break:break-word}
.status-game{color:var(--txt)}
.status-game.turn{color:var(--accent)}
.status-game.bad{color:var(--danger)}
.status-tech{color:#f1c40f}
.btn-row{display:flex;gap:8px;width:100%}
button{flex:1;padding:9px 6px;font-size:12px;border:none;border-radius:8px;cursor:pointer;font-weight:700;transition:transform .08s,filter .15s;letter-spacing:.2px}
button:hover{filter:brightness(1.08)}
button:active{transform:scale(.97)}
button.active{outline:2px solid var(--accent);box-shadow:0 0 0 1px var(--accent)}
.btn-del{background:var(--danger);color:#fff}
.btn-side{background:var(--blue);color:#fff}
.btn-reset{background:#c77d3e;color:#fff}
.btn-undo{background:#955ba8;color:#fff}
.spawn-panel{display:none;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.spawn-panel.visible{display:block}
.spawn-color-btn{width:100%;padding:8px;font-size:13px;background:#cfb487;color:#31210a;border:none;border-radius:6px;cursor:pointer;font-weight:700;margin-bottom:6px}
.spawn-color-btn.dark{background:#8a7358;color:#fff}
.spawn-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.spawn-btn{aspect-ratio:1;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;user-select:none}
.spawn-btn:hover{border-color:var(--muted)}
.spawn-btn.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.spawn-btn img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.selected{box-shadow:inset 0 0 0 4px rgba(243,235,76,.9)}
.move-dot{width:22%;height:22%;background:rgba(0,0,0,.25);border-radius:50%;position:absolute;pointer-events:none}
.square.move-cap::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 6px rgba(0,0,0,.3);pointer-events:none}
.square.last-move{background-image:linear-gradient(rgba(240,220,80,.42),rgba(240,220,80,.42))}
.check{background:radial-gradient(circle,rgba(255,40,40,.85) 22%,rgba(170,0,0,.9) 65%)!important}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.visible{display:flex}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:300px;width:90%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.modal-box p{margin:0 0 18px;font-size:16px}
.modal-btns{display:flex;gap:10px;justify-content:center}
.modal-btns button{padding:10px 20px;font-size:14px}
.btn-cancel{background:var(--panel2);color:var(--txt)}
.btn-ok{background:var(--danger);color:#fff}
.chat-toggle{position:absolute;top:6px;right:16px;width:40px;height:40px;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:100;font-size:20px;color:#fff;transition:all .2s;backdrop-filter:blur(4px)}
.chat-toggle:active{transform:scale(.9)}
.chat-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:none;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--bg)}
.chat-panel{position:fixed;top:0;right:-100%;width:85%;max-width:360px;height:100vh;height:100dvh;background:var(--panel);border-left:1px solid var(--line);z-index:2000;transition:right .3s;display:flex;flex-direction:column;overflow:hidden}
.chat-panel.open{right:0}
.chat-header{padding:14px;background:var(--panel2);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);flex-shrink:0}
.chat-header h3{margin:0;font-size:16px}
.chat-close{background:none;border:none;color:var(--txt);font-size:24px;cursor:pointer;padding:0 5px}
.moves-section{flex:1 1 50%;display:flex;flex-direction:column;border-bottom:1px solid var(--line);min-height:0;overflow:hidden}
.moves-header{padding:8px 12px;background:var(--panel2);font-size:12px;font-weight:700;color:#d7b26a;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);flex-shrink:0}
.moves-list{flex:1 1 auto;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px;font-family:'SF Mono',Consolas,monospace;font-size:13px;min-height:0}
.move-entry{display:flex;gap:8px;padding:5px 10px;background:var(--panel2);border-radius:6px}
.move-entry.hl{background:#353640;outline:1px solid var(--line)}
.move-num{color:var(--muted);min-width:26px}
.move-white{color:var(--txt);flex:1}
.move-black{color:var(--muted);flex:1}
.empty-hint{color:var(--muted);font-style:italic;text-align:center;padding:20px 8px;font-size:12px}
.empty-hint .ver{display:block;font-size:18px;font-weight:700;color:#d7b26a;margin-top:6px;font-style:normal}
.chat-section{flex:1 1 50%;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chat-messages{flex:1 1 auto;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.chat-msg{padding:9px 12px;border-radius:12px;max-width:85%;word-break:break-word;font-size:13px;position:relative;line-height:1.35}
.chat-msg.me{background:var(--accent-dark);align-self:flex-end;border-bottom-right-radius:4px;color:#102409}
.chat-msg.them{background:var(--panel2);align-self:flex-start;border-bottom-left-radius:4px}
.chat-msg .author{font-size:10px;opacity:.75;margin-bottom:4px;font-weight:700}
.chat-msg .time{font-size:10px;opacity:.6;text-align:right;margin-top:4px}
.chat-input-area{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px;flex-shrink:0}
.chat-input{flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:18px;background:var(--panel2);color:var(--txt);font-size:13px;outline:none}
.chat-input:focus{border-color:var(--accent)}
.chat-send{padding:10px 16px;background:var(--accent-dark);color:#102409;border:none;border-radius:50%;cursor:pointer;font-weight:700;font-size:16px;width:42px;height:42px;display:flex;align-items:center;justify-content:center}
.chat-send:hover{filter:brightness(1.08)}
</style>
</head>

function isSquareAttacked(index,color,tb){for(let i=0;i<64;i++){if(tb[i]&&tb[i][0]!==color){if(getRawMoves(i,tb,true,true).includes(index))return true}}return false}
function isKingInCheck(color,tb=board){const ki=[];for(let i=0;i<64;i++)if(tb[i]===color+'K')ki.push(i);if(!ki.length)return false;for(const k of ki)for(let i=0;i<64;i++){if(tb[i]&&tb[i][0]!==color&&getRawMoves(i,tb,true,true).includes(k))return true}return false}
function getValidMoves(index){const rm=getRawMoves(index),vm=[],p=board[index];if(!p)return[];const col=p[0],oppK=col==='w'?'bK':'wK';for(const mv of rm){if(board[mv]===oppK)continue;const tb=[...board];tb[mv]=p;tb[index]=null;if((p==='wP'||p==='wCPAWN')&&Math.floor(mv/8)===0)tb[mv]='wQ';if((p==='bP'||p==='bCPAWN')&&Math.floor(mv/8)===7)tb[mv]='bQ';if(p.slice(1)==='K'&&Math.abs(mv%8-index%8)===2){const br=Math.floor(index/8);if(mv%8===6){tb[br*8+5]=tb[br*8+7];tb[br*8+7]=null}else if(mv%8===2){tb[br*8+3]=tb[br*8+0];tb[br*8+0]=null}}if(!isKingInCheck(col,tb))vm.push(mv)}return vm}
const statusGameEl=document.getElementById('statusGame'),statusTechEl=document.getElementById('statusTech');
function setTechMsg(msg){statusTechEl.textContent=msg;setTimeout(()=>{if(statusTechEl.textContent===msg)statusTechEl.textContent=''},3000)}
function setStatus(text,kind){statusGameEl.textContent=text;statusGameEl.classList.remove('turn','bad');if(kind==='turn')statusGameEl.classList.add('turn');else if(kind==='bad')statusGameEl.classList.add('bad')}
function updateStatus(){
const wk=board.filter(p=>p==='wK').length,bk=board.filter(p=>p==='bK').length;
const kingless=(!wk||!bk||wk>1||bk>1);
let hm=false;
for(let i=0;i<64;i++)if(board[i]&&board[i][0]===currentTurn&&getValidMoves(i).length>0){hm=true;break}
const chk=!kingless&&isKingInCheck(currentTurn);
const moverWhite=currentTurn==='w';
const yourTurn=isHost?currentTurn===myColor:currentTurn!==hostColor;
if(kingless){
gameOver=!hm;
if(!hm){setStatus('Король взят! Победа '+(moverWhite?'чёрных':'белых'),'bad')}
else{setStatus(moverWhite?'Ход белых':'Ход чёрных',yourTurn?'turn':'')}
return}
if(!hm){gameOver=true;if(chk){setStatus(`МАТ! ${moverWhite?'чёрные':'белые'} победили!`,'bad')}else{setStatus('ПАТ! Ничья.','bad')}}
else{gameOver=false;if(chk){setStatus('ШАХ!','bad')}else{setStatus(moverWhite?'Ход белых':'Ход чёрных',yourTurn?'turn':'')}}}
function undoMove(){
  const snap=undoStack.pop();
  if(!snap){setTechMsg('Отменять нечего');return}
  board=snap.board;
  currentTurn=snap.turn||'w';
  lastMove=snap.lastMove||null;
  enPassantTarget=(snap.enPassantTarget==null?null:snap.enPassantTarget);
  castlingRights=snap.castlingRights||{wK:true,wQ:true,bK:true,bQ:true};
  moveHistory=snap.moveHistory||[];
  selected=null;gameOver=false;deleteMode=false;spawnMode=null;
  btnDel.classList.remove('active');document.querySelectorAll('.spawn-btn').forEach(b=>b.classList.remove('active'));
  syncToFirebase();render();updateStatus();updateMovesList();
  setTechMsg('Ход отменён');
}
const boardEl=document.getElementById('board');
function updateBoardOrientation(){if(myColor==='b')boardEl.classList.add('flipped');else boardEl.classList.remove('flipped')}
function render(){boardEl.innerHTML='';if(selected!==null&&!board[selected])selected=null;const pm=(selected!==null&&!gameOver&&!deleteMode&&!spawnMode)?getValidMoves(selected):[];let ci=-1;const kt=[];for(let i=0;i<64;i++)if(board[i]===currentTurn+'K')kt.push(i);if(kt.length===1&&isKingInCheck(currentTurn))ci=kt[0];for(let i=0;i<64;i++){const sq=document.createElement('div'),r=Math.floor(i/8),c=i%8;sq.className='square '+((r+c)%2===0?'light':'dark');if(blocked.has(i))sq.classList.add('blocked');if(lastMove&&(lastMove.from===i||lastMove.to===i))sq.classList.add('last-move');if(selected===i)sq.classList.add('selected');if(i===ci)sq.classList.add('check');if(pm.includes(i)){if(board[i]){sq.classList.add('move-cap')}else{const d=document.createElement('div');d.className='move-dot';sq.appendChild(d)}}if(board[i]){const key=board[i];if(croppedImages[key]){const im=document.createElement('img');im.src=croppedImages[key];im.className='piece-img';sq.appendChild(im)}else{const sp=document.createElement('span');sp.className='piece-txt '+key[0];sp.textContent=uniTxt[key]||'?';sq.appendChild(sp)}}sq.dataset.index=i;sq.addEventListener('click',()=>onSquareClick(i));boardEl.appendChild(sq)}}
function canSelectPiece(p){if(!p)return false;if(p[0]!==currentTurn)return false;if(isHost)return true;return currentTurn!==hostColor}
function explode3x3(centerIdx){const cr=Math.floor(centerIdx/8),cc=centerIdx%8;let exploded=0;for(let dr=-1;dr<=1;dr++){for(let dc=-1;dc<=1;dc++){const r=cr+dr,c=cc+dc;if(isValid(r,c)){const ti=r*8+c;if(board[ti]){board[ti]=null;exploded++}}}}return exploded}
function onSquareClick(i){if(deleteMode&&isHost){if(blocked.has(i)){blocked.delete(i);setTechMsg('Клетка разблокирована')}else if(board[i]){board[i]=null;selected=null;setTechMsg('Фигура удалена')}else{blocked.add(i);setTechMsg('Клетка заблокирована')}gameOver=false;syncToFirebase();render();updateStatus();return}if(spawnMode&&isHost){if(blocked.has(i)){setTechMsg('Клетка заблокирована!');return}board[i]=spawnMode;gameOver=false;syncToFirebase();render();updateStatus();setTechMsg('Фигура поставлена');return}if(gameOver)return;const p=board[i];if(selected===null){if(canSelectPiece(p)){selected=i;render()}}else{if(i===selected){selected=null;render();return}const sp=board[selected],vm=getValidMoves(selected);if(vm.includes(i)){const fromRow=Math.floor(selected/8),fromCol=selected%8,toRow=Math.floor(i/8),toCol=i%8;const captured=board[i]!==null;const isCastle=(sp.slice(1)==='K'&&Math.abs(toCol-fromCol)===2);const castleSide=isCastle?(toCol===6?'K':'Q'):null;
const tempBoard=[...board];tempBoard[i]=sp;tempBoard[selected]=null;
if(isCastle){if(toCol===6){tempBoard[fromRow*8+5]=tempBoard[fromRow*8+7];tempBoard[fromRow*8+7]=null}else if(toCol===2){tempBoard[fromRow*8+3]=tempBoard[fromRow*8+0];tempBoard[fromRow*8+0]=null}}
if((sp==='wP'||sp==='wCPAWN')&&toRow===0){tempBoard[i]='wQ'}if((sp==='bP'||sp==='bCPAWN')&&toRow===7){tempBoard[i]='bQ'}
if(isKingInCheck(sp[0],tempBoard)){setTechMsg('Этот ход оставляет вашего короля под шахом!');return}
undoStack.push({board:[...board],turn:currentTurn,lastMove:lastMove?{...lastMove}:null,enPassantTarget:enPassantTarget,castlingRights:{...castlingRights},moveHistory:[...moveHistory]});
board[i]=sp;board[selected]=null;
let explodedCount=0;
if(sp.slice(1)==='CKING'&&captured){explodedCount=explode3x3(i);if(explodedCount>0)setTechMsg('💥 Взрыв! Уничтожено: '+explodedCount)}
if(isCastle){if(toCol===6){board[fromRow*8+5]=board[fromRow*8+7];board[fromRow*8+7]=null}else if(toCol===2){board[fromRow*8+3]=board[fromRow*8+0];board[fromRow*8+0]=null}}if((sp.slice(1)==='P')&&Math.abs(toRow-fromRow)===2){enPassantTarget=(fromRow+toRow)/2*8+fromCol}else{enPassantTarget=null}if(sp==='wK'){castlingRights.wK=false;castlingRights.wQ=false}if(sp==='bK'){castlingRights.bK=false;castlingRights.bQ=false}if(sp==='wR'&&selected===63)castlingRights.wK=false;if(sp==='wR'&&selected===56)castlingRights.wQ=false;if(sp==='bR'&&selected===7)castlingRights.bK=false;if(sp==='bR'&&selected===0)castlingRights.bQ=false;if(i===63)castlingRights.wK=false;if(i===56)castlingRights.wQ=false;if(i===7)castlingRights.bK=false;if(i===0)castlingRights.bQ=false;let promotion=null;if((sp==='wP'||sp==='wCPAWN')&&toRow===0){board[i]='wQ';promotion='wQ'}if((sp==='bP'||sp==='bCPAWN')&&toRow===7){board[i]='bQ';promotion='bQ'}
let notation=buildNotation(selected,i,sp,captured,false,isCastle,castleSide,promotion);
const oppColor=sp[0]==='w'?'b':'w';const oppCheck=isKingInCheck(oppColor);if(oppCheck){const hasOppMoves=(()=>{for(let j=0;j<64;j++)if(board[j]&&board[j][0]===oppColor&&getValidMoves(j).length>0)return true;return false})();if(!hasOppMoves)notation+='#';else notation+='+'}
moveHistory.push(notation);
lastMove={from:selected,to:i};selected=null;
currentTurn=currentTurn==='w'?'b':'w';
gameOver=false;
syncToFirebase();render();updateStatus();updateMovesList()}else{if(canSelectPiece(p)){selected=i;render()}else{selected=null;render()}}}}
const roomRef=db.ref('rooms/default');
function syncToFirebase(){try{const rev=appliedRev+1;appliedRev=rev;appliedWriter=CLIENT_ID;roomRef.update({board:board,blocked:Array.from(blocked),turn:currentTurn,hostColor:isHost?myColor:hostColor,lastMove:lastMove,enPassantTarget:enPassantTarget,castlingRights:castlingRights,moveHistory:moveHistory,undoStack:undoStack,updated:Date.now(),rev:rev,writer:CLIENT_ID})}catch(e){}}
roomRef.on('value',snap=>{const d=snap.val();if(!d){statusGameEl.textContent='Сделайте ход';return}
if(typeof d.rev==='number'){const w=d.writer||'';if(d.rev<appliedRev)return;if(d.rev===appliedRev&&w<=appliedWriter)return;appliedRev=d.rev;appliedWriter=w}else if(d.writer===CLIENT_ID){return}
if(d.board)board=Array.from({length:64},(_,i)=>d.board[i]||null);blocked=new Set(d.blocked||[]);currentTurn=d.turn||'w';lastMove=d.lastMove||null;enPassantTarget=(d.enPassantTarget==null?null:d.enPassantTarget);castlingRights=d.castlingRights||{wK:true,wQ:true,bK:true,bQ:true};moveHistory=d.moveHistory||[];undoStack=d.undoStack||[];if(d.hostColor){hostColor=d.hostColor;if(!isHost)myColor=hostColor==='w'?'b':'w'}selected=null;updateBoardOrientation();if(isHost)updateSideButton();render();updateStatus();updateMovesList()});
const chatRef=db.ref('rooms/default/chat');
const chatMessagesEl=document.getElementById('chatMessages'),chatBadge=document.getElementById('chatBadge');
function renderChatEmpty(){chatMessagesEl.innerHTML='<div class="empty-hint">♟ Шахматы<span class="ver">v'+APP_VERSION+'</span></div>'}
renderChatEmpty();
chatRef.on('value',snap=>{const msgs=snap.val()||{};const keys=Object.keys(msgs).sort((a,b)=>(msgs[a].time||0)-(msgs[b].time||0));if(keys.length===0){renderChatEmpty();lastMsgCount=0;return}chatMessagesEl.innerHTML='';keys.forEach(k=>{const m=msgs[k];const senderIsWhite=m.role==='host'?m.hostColor==='w':m.hostColor!=='w';const senderName=senderIsWhite?'♔ Белые':'♟ Чёрные';const isMe=m.role===(isHost?'host':'guest');const div=document.createElement('div');div.className='chat-msg '+(isMe?'me':'them');const time=new Date(m.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});div.innerHTML=`<div class="author">${isMe?'Вы':senderName}</div>${escapeHtml(m.text||'')}<div class="time">${time}</div>`;chatMessagesEl.appendChild(div)});chatMessagesEl.scrollTop=chatMessagesEl.scrollHeight;if(keys.length>lastMsgCount&&!chatOpen){unreadCount++;chatBadge.textContent=unreadCount;chatBadge.style.display='flex'}lastMsgCount=keys.length});
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function sendChat(){const inp=document.getElementById('chatInput');const text=inp.value.trim();if(!text)return;chatRef.push({text:text,role:isHost?'host':'guest',hostColor:myColor,time:Date.now()});inp.value=''}
document.getElementById('chatSend').onclick=sendChat;
document.getElementById('chatInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendChat()});
const chatPanel=document.getElementById('chatPanel'),chatToggle=document.getElementById('chatToggle');
chatToggle.onclick=()=>{chatOpen=!chatOpen;chatPanel.classList.toggle('open',chatOpen);if(chatOpen){unreadCount=0;chatBadge.style.display='none';setTimeout(()=>document.getElementById('chatInput').focus(),300)}};
document.getElementById('chatClose').onclick=()=>{chatOpen=false;chatPanel.classList.remove('open')};
const btnDel=document.getElementById('btnDel'),btnSide=document.getElementById('btnSide'),btnReset=document.getElementById('btnReset'),spawnPanel=document.getElementById('spawnPanel'),spawnColorBtn=document.getElementById('spawnColorBtn');
function updateSideButton(){btnSide.textContent=myColor==='w'?'🔄 Сторона: Белые':'🔄 Сторона: Чёрные'}
updateSideButton();
function buildSpawnPanel(){const grid=document.getElementById('spawnGrid');grid.innerHTML='';spawnColorBtn.textContent=spawnColor==='w'?'⚪ Белые':'⚫ Чёрные';spawnColorBtn.className='spawn-color-btn'+(spawnColor==='b'?' dark':'');spawnColorBtn.onclick=()=>{spawnColor=spawnColor==='w'?'b':'w';if(spawnMode){spawnMode=null}buildSpawnPanel();render()};spawnTypes.forEach(([type,label])=>{const btn=document.createElement('div');btn.className='spawn-btn';btn.dataset.type=type;const key=spawnColor+type;if(croppedImages[key]){const img=document.createElement('img');img.src=croppedImages[key];btn.appendChild(img)}else{btn.textContent=label;btn.style.color=spawnColor==='w'?'#fff':'#ddd'}btn.onclick=()=>selectSpawn(key);grid.appendChild(btn)});if(spawnMode){const type=spawnMode.slice(1);const el=document.querySelector(`.spawn-btn[data-type="${type}"]`);if(el)el.classList.add('active')}}
function selectSpawn(pk){document.querySelectorAll('.spawn-btn').forEach(b=>b.classList.remove('active'));if(spawnMode===pk){spawnMode=null;deleteMode=false;btnDel.classList.remove('active');setTechMsg('Спавн выключен')}else{spawnMode=pk;deleteMode=false;btnDel.classList.remove('active');const type=pk.slice(1);const el=document.querySelector(`.spawn-btn[data-type="${type}"]`);if(el)el.classList.add('active');setTechMsg('Выберите клетку')}render()}
const modalOverlay=document.getElementById('modalOverlay'),modalText=document.getElementById('modalText'),modalCancel=document.getElementById('modalCancel'),modalOk=document.getElementById('modalOk');
let modalCallback=null;
function showModal(text,cb){modalText.textContent=text;modalCallback=cb;modalOverlay.classList.add('visible')}
function hideModal(){modalOverlay.classList.remove('visible');modalCallback=null}
modalCancel.onclick=hideModal;
modalOk.onclick=()=>{if(modalCallback)modalCallback();hideModal()};
if(isHost){btnDel.style.display='block';btnSide.style.display='block';btnReset.style.display='block';btnUndo.style.display='block';spawnPanel.classList.add('visible');btnUndo.onclick=undoMove;btnDel.onclick=()=>{deleteMode=!deleteMode;spawnMode=null;document.querySelectorAll('.spawn-btn').forEach(b=>b.classList.remove('active'));btnDel.classList.toggle('active',deleteMode);setTechMsg(deleteMode?'Режим удаления':'Выключено');if(deleteMode)selected=null;render()};btnSide.onclick=()=>{myColor=myColor==='w'?'b':'w';hostColor=myColor;selected=null;updateSideButton();updateBoardOrientation();setTechMsg(`Теперь вы за ${myColor==='w'?'белых':'чёрных'}`);syncToFirebase();render()};btnReset.onclick=()=>showModal('Сбросить игру?',()=>{startBoard();blocked.clear();selected=null;currentTurn='w';gameOver=false;deleteMode=false;spawnMode=null;btnDel.classList.remove('active');document.querySelectorAll('.spawn-btn').forEach(b=>b.classList.remove('active'));try{chatRef.remove()}catch(e){}lastMsgCount=0;unreadCount=0;chatBadge.style.display='none';renderChatEmpty();syncToFirebase();render();updateStatus();updateMovesList();setTechMsg('Игра сброшена')})}
function updateMovesList(){const movesListEl=document.getElementById('movesList');if(!moveHistory||moveHistory.length===0){movesListEl.innerHTML='<div class="empty-hint">Пока нет ходов</div>';return}movesListEl.innerHTML='';for(let i=0;i<moveHistory.length;i+=2){const moveNum=Math.floor(i/2)+1;const whiteMove=moveHistory[i]||'';const blackMove=moveHistory[i+1]||'';const entry=document.createElement('div');entry.className='move-entry';entry.innerHTML=`<span class="move-num">${moveNum}.</span><span class="move-white">${whiteMove}</span><span class="move-black">${blackMove}</span>`;if(i+1===moveHistory.length)entry.classList.add('hl');movesListEl.appendChild(entry)}movesListEl.scrollTop=movesListEl.scrollHeight}
updateBoardOrientation();
render();
updateStatus();
updateMovesList();
if(isHost)buildSpawnPanel();
setTechMsg('v'+APP_VERSION);
const standardK=['wP','wR','wN','wB','wQ','wK','bP','bR','bN','bB','bQ','bK'];
const customK=Object.keys(pieceFiles).filter(k=>standardK.indexOf(k)<0);
let imgPhase='std',imgIx=0,imgHot=false;
function loadPieces(){
  const list=imgPhase==='std'?standardK:customK;
  const step=()=>{
    if(imgIx>=list.length){
      if(imgPhase==='std'){
        imgPhase='custom';imgIx=0;
        if(!imgHot){imgHot=true;render()}
        loadPieces();
      }else{
        if(!imgHot){imgHot=true;render()}
        if(isHost)buildSpawnPanel();
      }
      return;
    }
    const k=list[imgIx++];
    cropImage(pieceFiles[k],data=>{if(data)croppedImages[k]=data;step()})
  };
  step()
}
setTimeout(loadPieces,60);
</script>
