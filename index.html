.chat-send{padding:10px 16px;background:#27ae60;color:#fff;border:none;border-radius:20px;cursor:pointer;font-weight:bold;font-size:16px}

function render(){boardEl.innerHTML='';if(selected!==null&&!board[selected])selected=null;const pm=(selected!==null&&!gameOver&&!deleteMode&&!spawnMode)?getValidMoves(selected):[];let ci=-1;const kt=[];for(let i=0;i<64;i++)if(board[i]===currentTurn+'K')kt.push(i);if(kt.length===1&&isKingInCheck(currentTurn))ci=kt[0];for(let i=0;i<64;i++){const sq=document.createElement('div'),r=Math.floor(i/8),c=i%8;sq.className='square '+((r+c)%2===0?'light':'dark');if(blocked.has(i))sq.classList.add('blocked');if(selected===i)sq.classList.add('selected');if(i===ci)sq.classList.add('check');if(pm.includes(i)){const d=document.createElement('div');d.className='move-dot';sq.appendChild(d)}if(board[i]){const key=board[i];if(croppedImages[key]){const im=document.createElement('img');im.src=croppedImages[key];im.className='piece-img';if(key[0]==='b'&&isStandardPiece(key))im.classList.add('dark-piece');sq.appendChild(im)}else{const sp=document.createElement('span');sp.className='piece-txt '+key[0];sp.textContent=uniTxt[key]||'?';sq.appendChild(sp)}}sq.dataset.index=i;sq.addEventListener('click',()=>onSquareClick(i));boardEl.appendChild(sq)}}
function canSelectPiece(p){if(!p)return false;if(p[0]!==currentTurn)return false;if(isHost)return true;return p[0]===myColor}
function onSquareClick(i){if(deleteMode&&isHost){if(blocked.has(i)){blocked.delete(i);setTechMsg('Клетка разблокирована')}else if(board[i]){board[i]=null;selected=null;setTechMsg('Фигура удалена')}else{blocked.add(i);setTechMsg('Клетка заблокирована')}gameOver=false;syncToFirebase();render();updateStatus();return}if(spawnMode&&isHost){if(blocked.has(i)){setTechMsg('Клетка заблокирована!');return}board[i]=spawnMode;gameOver=false;syncToFirebase();render();updateStatus();setTechMsg('Фигура поставлена');return}if(gameOver)return;const p=board[i];if(selected===null){if(canSelectPiece(p)){selected=i;render()}}else{if(i===selected){selected=null;render();return}const sp=board[selected],vm=getValidMoves(selected);if(vm.includes(i)){const fromRow=Math.floor(selected/8),fromCol=selected%8,toRow=Math.floor(i/8),toCol=i%8;const captured=board[i]!==null;const isEnPassant=((sp[1]==='P'||sp[1]==='CPAWN')&&enPassantTarget!=null&&i===enPassantTarget);const isCastle=(sp[1]==='K'&&Math.abs(toCol-fromCol)===2);const castleSide=isCastle?(toCol===6?'K':'Q'):null;
const tempBoard=[...board];tempBoard[i]=sp;tempBoard[selected]=null;
if(isEnPassant)tempBoard[fromRow*8+toCol]=null;
if(isCastle){if(toCol===6){tempBoard[fromRow*8+5]=tempBoard[fromRow*8+7];tempBoard[fromRow*8+7]=null}else if(toCol===2){tempBoard[fromRow*8+3]=tempBoard[fromRow*8+0];tempBoard[fromRow*8+0]=null}}
if((sp==='wP'||sp==='wCPAWN')&&toRow===0){tempBoard[i]='wQ'}if((sp==='bP'||sp==='bCPAWN')&&toRow===7){tempBoard[i]='bQ'}
if(isKingInCheck(sp[0],tempBoard)){setTechMsg('Этот ход оставляет вашего короля под шахом!');return}
board[i]=sp;board[selected]=null;if(isEnPassant){board[fromRow*8+toCol]=null}if(isCastle){if(toCol===6){board[fromRow*8+5]=board[fromRow*8+7];board[fromRow*8+7]=null}else if(toCol===2){board[fromRow*8+3]=board[fromRow*8+0];board[fromRow*8+0]=null}}if((sp[1]==='P'||sp[1]==='CPAWN')&&Math.abs(toRow-fromRow)===2){enPassantTarget=(fromRow+toRow)/2*8+fromCol}else{enPassantTarget=null}if(sp==='wK'){castlingRights.wK=false;castlingRights.wQ=false}if(sp==='bK'){castlingRights.bK=false;castlingRights.bQ=false}if(sp==='wR'&&selected===63)castlingRights.wK=false;if(sp==='wR'&&selected===56)castlingRights.wQ=false;if(sp==='bR'&&selected===7)castlingRights.bK=false;if(sp==='bR'&&selected===0)castlingRights.bQ=false;if(i===63)castlingRights.wK=false;if(i===56)castlingRights.wQ=false;if(i===7)castlingRights.bK=false;if(i===0)castlingRights.bQ=false;let promotion=null;if((sp==='wP'||sp==='wCPAWN')&&toRow===0){board[i]='wQ';promotion='wQ'}if((sp==='bP'||sp==='bCPAWN')&&toRow===7){board[i]='bQ';promotion='bQ'}
const notation=buildNotation(selected,i,sp,captured||isEnPassant,isEnPassant,isCastle,castleSide,promotion);
const oppColor=sp[0]==='w'?'b':'w';const oppCheck=isKingInCheck(oppColor);if(oppCheck){const hasOppMoves=(()=>{for(let j=0;j<64;j++)if(board[j]&&board[j][0]===oppColor&&getValidMoves(j).length>0)return true;return false})();if(!hasOppMoves)notation+='#';else notation+='+'}
moveHistory.push(notation);
lastMove={from:selected,to:i};selected=null;
currentTurn=currentTurn==='w'?'b':'w';
gameOver=false;
syncToFirebase();render();updateStatus();updateMovesList()}else{if(canSelectPiece(p)){selected=i;render()}else{selected=null;render()}}}}
const roomRef=db.ref('rooms/default');
function syncToFirebase(){try{const now=Date.now();lastUpdated=now;roomRef.set({board:board,blocked:Array.from(blocked),turn:currentTurn,hostColor:myColor,lastMove:lastMove,enPassantTarget:enPassantTarget,castlingRights:castlingRights,moveHistory:moveHistory,updated:now})}catch(e){}}
roomRef.on('value',snap=>{const d=snap.val();if(!d){statusGameEl.textContent='Сделайте ход';return}
if(d.updated&&d.updated<=lastUpdated)return;
if(d.board)board=Array.from({length:64},(_,i)=>d.board[i]||null);blocked=new Set(d.blocked||[]);currentTurn=d.turn||'w';lastMove=d.lastMove||null;enPassantTarget=(d.enPassantTarget==null?null:d.enPassantTarget);castlingRights=d.castlingRights||{wK:true,wQ:true,bK:true,bQ:true};moveHistory=d.moveHistory||[];if(!isHost&&d.hostColor){myColor=d.hostColor==='w'?'b':'w'}updateBoardOrientation();if(isHost)updateSideButton();render();updateStatus();updateMovesList()});
const chatRef=db.ref('rooms/default/chat');
const chatMessagesEl=document.getElementById('chatMessages'),chatBadge=document.getElementById('chatBadge');
function renderChatEmpty(){chatMessagesEl.innerHTML='<div class="empty-hint">♟ Шахматы<span class="ver">v'+APP_VERSION+'</span></div>'}
renderChatEmpty();
chatRef.on('value',snap=>{const msgs=snap.val()||{};const keys=Object.keys(msgs).sort((a,b)=>(msgs[a].time||0)-(msgs[b].time||0));if(keys.length===0){renderChatEmpty();lastMsgCount=0;return}chatMessagesEl.innerHTML='';keys.forEach(k=>{const m=msgs[k];const senderIsWhite=m.role==='host'?m.hostColor==='w':m.hostColor!=='w';const senderName=senderIsWhite?'♔ Белые':'♟ Чёрные';const isMe=m.role===(isHost?'host':'guest');const div=document.createElement('div');div.className='chat-msg '+(isMe?'me':'them');const time=new Date(m.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});div.innerHTML=`<div class="author">${isMe?'Вы':senderName}</div>${escapeHtml(m.text||'')}<div class="time">${time}</div>`;chatMessagesEl.appendChild(div)});chatMessagesEl.scrollTop=chatMessagesEl.scrollHeight;if(keys.length>lastMsgCount&&!chatOpen){unreadCount++;chatBadge.textContent=unreadCount;chatBadge.style.display='flex'}lastMsgCount=keys.length});
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function sendChat(){const inp=document.getElementById('chatInput');const text=inp.value.trim();if(!text)return;chatRef.push({text:text,role:isHost?'host':'guest',hostColor:myColor,time:Date.now()});inp.value=''}
document.getElementById('chatSend').onclick=sendChat;
document.getElementById('chatInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendChat()});
const chatPanel=document.getElementById('chatPanel'),chatToggle=document.getElementById('chatToggle');
chatToggle.onclick=()=>{chatOpen=!chatOpen;chatPanel.classList.toggle('open',chatOpen);if(chatOpen){unreadCount=0;chatBadge.style.display='none';setTimeout(()=>document.getElementById('chatInput').focus(),300)}};
document.getElementById('chatClose').onclick=()=>{chatOpen=false;chatPanel.classList.remove('open')};
const btnDel=document.getElementById('btnDel'),btnSide=document.getElementById('btnSide'),btnReset=document.getElementById('btnReset'),spawnPanel=document.getElementById('spawnPanel'),spawnColorBtn=document.getElementById('spawnColorBtn');
function updateSideButton(){btnSide.textContent=myColor==='w'?'🔄 Сторона: Белые':'🔄 Сторона: Чёрные'}
updateSideButton();
function buildSpawnPanel(){const grid=document.getElementById('spawnGrid');grid.innerHTML='';spawnColorBtn.textContent=spawnColor==='w'?'⚪ Белые':'⚫ Чёрные';spawnColorBtn.className='spawn-color-btn'+(spawnColor==='b'?' dark':'');spawnColorBtn.onclick=()=>{spawnColor=spawnColor==='w'?'b':'w';if(spawnMode){spawnMode=null}buildSpawnPanel();render()};spawnTypes.forEach(([type,label])=>{const btn=document.createElement('div');btn.className='spawn-btn';btn.dataset.type=type;const key=spawnColor+type;if(croppedImages[key]){const img=document.createElement('img');img.src=croppedImages[key];if(spawnColor==='b'&&isStandardPiece(key))img.classList.add('dark-piece');btn.appendChild(img)}else{btn.textContent=label;btn.style.color=spawnColor==='w'?'#fff':'#ddd'}btn.onclick=()=>selectSpawn(key);grid.appendChild(btn)});if(spawnMode){const type=spawnMode.slice(1);const el=document.querySelector(`.spawn-btn[data-type="${type}"]`);if(el)el.classList.add('active')}}
function selectSpawn(pk){document.querySelectorAll('.spawn-btn').forEach(b=>b.classList.remove('active'));if(spawnMode===pk){spawnMode=null;deleteMode=false;btnDel.classList.remove('active');setTechMsg('Спавн выключен')}else{spawnMode=pk;deleteMode=false;btnDel.classList.remove('active');const type=pk.slice(1);const el=document.querySelector(`.spawn-btn[data-type="${type}"]`);if(el)el.classList.add('active');setTechMsg('Выберите клетку')}render()}
const modalOverlay=document.getElementById('modalOverlay'),modalText=document.getElementById('modalText'),modalCancel=document.getElementById('modalCancel'),modalOk=document.getElementById('modalOk');
let modalCallback=null;
function showModal(text,cb){modalText.textContent=text;modalCallback=cb;modalOverlay.classList.add('visible')}
function hideModal(){modalOverlay.classList.remove('visible');modalCallback=null}
modalCancel.onclick=hideModal;
modalOk.onclick=()=>{if(modalCallback)modalCallback();hideModal()};
if(isHost){btnDel.style.display='block';btnSide.style.display='block';btnReset.style.display='block';spawnPanel.classList.add('visible');btnDel.onclick=()=>{deleteMode=!deleteMode;spawnMode=null;document.querySelectorAll('.spawn-btn').forEach(b=>b.classList.remove('active'));btnDel.classList.toggle('active',deleteMode);setTechMsg(deleteMode?'Режим удаления':'Выключено');if(deleteMode)selected=null;render()};btnSide.onclick=()=>{myColor=myColor==='w'?'b':'w';selected=null;updateSideButton();updateBoardOrientation();setTechMsg(`Теперь вы за ${myColor==='w'?'белых':'чёрных'}`);syncToFirebase();render()};btnReset.onclick=()=>showModal('Сбросить игру?',()=>{startBoard();blocked.clear();selected=null;currentTurn='w';gameOver=false;deleteMode=false;spawnMode=null;btnDel.classList.remove('active');document.querySelectorAll('.spawn-btn').forEach(b=>b.classList.remove('active'));try{chatRef.remove()}catch(e){}lastMsgCount=0;unreadCount=0;chatBadge.style.display='none';renderChatEmpty();syncToFirebase();render();updateStatus();updateMovesList();setTechMsg('Игра сброшена')})}
function updateMovesList(){const movesListEl=document.getElementById('movesList');if(!moveHistory||moveHistory.length===0){movesListEl.innerHTML='<div class="empty-hint">Пока нет ходов</div>';return}movesListEl.innerHTML='';for(let i=0;i<moveHistory.length;i+=2){const moveNum=Math.floor(i/2)+1;const whiteMove=moveHistory[i]||'';const blackMove=moveHistory[i+1]||'';const entry=document.createElement('div');entry.className='move-entry';entry.innerHTML=`<span class="move-num">${moveNum}.</span><span class="move-white">${whiteMove}</span><span class="move-black">${blackMove}</span>`;movesListEl.appendChild(entry)}movesListEl.scrollTop=movesListEl.scrollHeight}
updateBoardOrientation();
render();
updateStatus();
updateMovesList();
if(isHost)buildSpawnPanel();
setTechMsg('v'+APP_VERSION);
for(const k in pieceFiles){cropImage(pieceFiles[k],data=>{if(data){croppedImages[k]=data;render();if(isHost)buildSpawnPanel()}})}
</script>
