<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Шахматы</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #222; color: #eee; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    
    #board { 
      display: grid; 
      grid-template-columns: repeat(8, 42px); 
      grid-template-rows: repeat(8, 42px);    
      width: 336px;  
      height: 336px; 
      border: 2px solid #444;
      margin: 0 auto;
    }
    
    .square { 
      width: 42px;
      height: 42px;
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      user-select: none; 
      position: relative;
      overflow: hidden; 
    }
    
    .light { background: #f0d9b5; }
    .dark { background: #b58863; }
    .blocked { background: #444 !important; cursor: not-allowed; border: 1px solid #222; }
    
    .piece-img { 
      width: 100%;   
      height: 100%;  
      object-fit: contain; 
      pointer-events: none; 
      display: block;
    }

    #controls { width: 336px; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 16px; }
